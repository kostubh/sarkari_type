<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SarkariType - Free Typing Test for Government Exams</title>
    <meta name="robots" content="noindex, follow" />
    <script>
      // SPA redirect for GitHub Pages
      // Preserves the path so react-router can handle it
      var basePath = '/sarkari_type';
      var path = location.pathname;
      if (path.startsWith(basePath)) {
        var route = path.slice(basePath.length);
        // Store the route in sessionStorage so the app can pick it up
        sessionStorage.setItem('spa-redirect', route || '/');
        window.location.replace(basePath + '/?redirect=' + encodeURIComponent(route || '/'));
      } else {
        window.location.replace(basePath + '/');
      }
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
